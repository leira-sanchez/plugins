name: Validate pstack for Codex

on:
  pull_request:
    paths:
      - "pstack/**"
      - ".github/workflows/validate-pstack-codex.yml"
  push:
    branches: [main]
    paths:
      - "pstack/**"
      - ".github/workflows/validate-pstack-codex.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyyaml
      - run: python pstack/scripts/validate-codex.py
      - run: python -m unittest discover -s pstack/scripts -p 'test_*.py'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
        working-directory: pstack/skills/poteto-mode/scripts
      - run: bun test orch watch-pr
        working-directory: pstack/skills/poteto-mode/scripts
      - run: bun run typecheck
        working-directory: pstack/skills/poteto-mode/scripts
